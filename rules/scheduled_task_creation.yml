title: Scheduled Task Created via Command Line
id: cffc6c66-9481-4e20-b71f-129b2a84eee9
status: experimental
description: Detects schtasks.exe creating a scheduled task, a common way attackers keep access to a system or run code later.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Chihiro Tatsukawa
date: 2026-10-03
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|contains:
            - '/create'
            - '-create'
    condition: selection_img and selection_create
falsepositives:
    - Software installers and auto-updaters
    - Administrator scripts and IT management tools
level: low
